<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- TEMA: cor da barra do navegador (acompanha --bg) -->
<meta name="theme-color" content="#0F0A07">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loja</title>
<!-- TEMA: fontes (se trocar aqui, troque também --font-display e --font-body no bloco de tema abaixo) -->
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   TEMA — identidade visual do cliente. Para trocar de marca,
   altere SOMENTE este bloco (e as fontes no <head>).
   Nome da marca e logo padrão: veja CFG no início do <script>.
   ══════════════════════════════════════════════════════════════ */
:root{
 color-scheme:dark;
 /* fundos */
 --bg:#0F0A07;          /* fundo principal (marrom quase preto) */
 --card:#1A110C;        /* cartões, painéis, campos */
 --head-bg:rgba(15,10,7,.9); /* cabeçalho */
 --foot-bg:#0A0604;     /* rodapé */
 --ph:#120B07;          /* fundo atrás das fotos */
 --glow:radial-gradient(ellipse 85% 100% at 50% 0,rgba(255,106,0,.22),rgba(255,106,0,0) 70%); /* brilho no topo (use none p/ desligar) */
 /* textos */
 --ink:#FFF1E0;         /* texto principal (creme claro) */
 --mut:#BBA796;         /* texto secundário */
 --cream:#FFE3C2;       /* creme: textos de respiro */
 --foot-ink:#E8D3BB;    /* texto do rodapé */
 --on-banner:#FFFFFF;   /* texto sobre imagens de banner */
 /* destaque (dourado/bronze) */
 --acc:#FF7A1A;
 --acc2:#FF9A45;        /* hover */
 --on-acc:#1A0D05;      /* texto sobre botões dourados */
 /* linhas e camadas */
 --line:#3D2616;
 --scrim:rgba(5,3,2,.78);       /* fundo do pop-up */
 --overlay:rgba(8,5,3,.5);      /* véu sobre banners */
 --chip:rgba(13,9,7,.85);       /* botão fechar do pop-up */
 --banner-from:#2A0F05;         /* banner sem imagem */
 --banner-to:#B84A0B;
 --ok:#5DB487;                  /* pedido concluído */
 /* tipografia */
 --font-display:'Oswald','Arial Narrow',sans-serif;
 --font-body:'Inter',system-ui,sans-serif;
 --font-label:'Inter',system-ui,sans-serif; /* preços, etiquetas, rótulos */
 --w-display:600;
 --s-display:normal;    /* italic | normal */
 --t-display:uppercase;      /* none | uppercase */
 --t-label:uppercase;   /* none | uppercase */
 --ls-label:.08em;
 /* formas */
 --r-card:18px;         /* cartões e pop-up (0 = quadrado) */
 --r-btn:999px;         /* botões */
 --r-input:14px;        /* campos */
}
/* ═══════════════ FIM DO TEMA ═══════════════ */
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-body);padding-top:env(safe-area-inset-top,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.serif{font-family:'Bodoni Moda',Georgia,serif;font-weight:400}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-size:26px;letter-spacing:.04em}
.bag{background:none;border:1px solid var(--ink);border-radius:99px;padding:8px 18px;font-weight:500}
.hero{padding:9vh 5vw 6vh;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(44px,9vw,116px);line-height:.98;letter-spacing:-.02em;max-width:11ch}
.hero p{margin-top:22px;color:var(--mut);max-width:34ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px;padding:0 5vw 10vh;max-width:1200px;margin:auto}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:44px 22px}}
.item .ph{aspect-ratio:4/5;background:var(--card) center/cover;position:relative;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.item:hover .ph img{transform:scale(1.03)}
.item h3{font-size:14px;font-weight:500;margin-top:12px}
.item .pr{color:var(--mut);margin-bottom:10px}
.tag{position:absolute;left:10px;top:10px;background:var(--bg);padding:3px 10px;font-size:12px;border-radius:99px}
.old{color:var(--mut);text-decoration:line-through;font-weight:400;opacity:.75;margin-right:6px}
.promo{color:var(--acc)}
.sale{position:absolute;right:10px;top:10px;background:var(--acc);color:var(--on-acc);padding:3px 10px;font-size:11px;border-radius:99px;font-weight:700}
.add{width:100%;background:var(--ink);color:var(--bg);border:0;padding:11px;font-weight:500}
.add:disabled{background:var(--line);color:var(--mut);cursor:default}
.empty{grid-column:1/-1;color:var(--mut);padding:40px 0}
footer{padding:30px 5vw;border-top:1px solid var(--line);color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
footer a{color:inherit}
.ov{position:fixed;inset:0;background:var(--scrim);display:none;z-index:10}
.ov.on{display:block}
.dr{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:11;transform:translateX(100%);transition:transform .35s;display:flex;flex-direction:column;padding:22px 22px calc(80px + env(safe-area-inset-bottom,0));overflow-y:auto;-webkit-overflow-scrolling:touch}
.dr.on{transform:none}
.dr h2{font-size:28px;margin-bottom:14px}
.lines{flex:none;overflow:visible}
.ln{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.ln img{width:56px;height:70px;object-fit:cover;background:var(--card)}
.ln .n{flex:1;font-weight:500;font-size:14px}
.q{display:flex;align-items:center;gap:10px}
.q button{width:28px;height:28px;border:1px solid var(--line);background:none;border-radius:50%}
.fld{display:grid;gap:8px;margin:14px 0}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--card);border-radius:0}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:17px;margin-top:4px}
.wa{width:100%;background:var(--acc);color:var(--on-acc);border:0;padding:14px;font-weight:600;margin-top:12px}
.x{align-self:flex-end;background:none;border:0;font-size:22px}
.acts{display:flex;gap:8px}
.rd{flex:1;border:0;border-radius:99px;background:var(--acc);color:var(--on-acc);padding:11px;font-weight:600}
.sq{width:44px;height:44px;border:1px solid var(--ink);background:none;font-size:20px;border-radius:0}
.rd:disabled,.sq:disabled{opacity:.35;cursor:default}
.tabs{display:flex;gap:6px;margin:16px 0;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 14px;color:var(--mut);font-weight:500}.tabs .on{color:var(--ink);border-bottom:2px solid var(--acc)}
.ord{border:1px solid var(--acc);box-shadow:0 0 0 1px rgba(255,122,26,.22);background:var(--card);padding:14px;margin:10px 0;display:grid;gap:6px}
.ord.concluido{border-left:4px solid var(--ok)}.ord.cancelado{opacity:.55}
.serif{font-family:Archivo,'Arial Black',sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:.01em}
header{padding:16px 5vw;gap:16px}
.logo{font-size:20px;color:var(--acc)}
nav.nv{display:none;gap:30px;font-size:14px}
nav.nv a{color:var(--ink);text-decoration:none;opacity:.85}
@media(min-width:800px){nav.nv{display:flex}}
.bag{border-color:var(--acc);color:var(--acc)}
.hero{display:grid;gap:28px;align-items:center;max-width:1200px;margin:auto;padding:6vh 5vw 2vh}
@media(min-width:800px){.hero:has(#bn img){grid-template-columns:1fr 1.1fr}.hero{padding:9vh 5vw 4vh}}
.hero h1{font-size:clamp(38px,7vw,76px);line-height:1;max-width:none}
.hero p{max-width:42ch;color:var(--mut)}
.hbt{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{padding:13px 24px;border-radius:4px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
#bn:empty{display:none}#bn img{border-radius:20px}
.sec{max-width:1200px;margin:auto;padding:7vh 5vw 0;scroll-margin-top:70px}
.sh{text-align:center;margin-bottom:28px}.sh h2{font-size:clamp(24px,4vw,34px)}
.sh i{display:block;width:26px;height:3px;background:var(--acc);margin:12px auto 0}
.feat{display:grid;grid-template-columns:1fr;gap:18px}
@media(min-width:800px){.feat{grid-template-columns:repeat(3,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid{max-width:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column}
.feat .item{background:var(--card);padding:18px}
.item .ph{border-radius:8px;background-color:var(--bg)}
.item h3{text-align:center;font-size:15px;margin-top:14px}
.item .pr{text-align:center;color:var(--acc);font-weight:700;margin-bottom:4px}
.item .ds{color:var(--mut);font-size:12.5px;text-align:center;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{margin-top:auto}
.rd{background:var(--acc2)}.rd:hover:not(:disabled){background:var(--acc)}
.sq{border-color:var(--line)}
footer{display:block;max-width:1200px;margin:8vh auto 0;padding:34px 5vw}
.fg{display:grid;gap:26px;grid-template-columns:1fr 1fr}
.fg .br{grid-column:1/-1}
@media(min-width:800px){.fg{grid-template-columns:2fr 1fr 1fr}.fg .br{grid-column:auto}}
.fg b{display:block;margin-bottom:10px;color:var(--ink)}
.fg a,.fg span{display:block;color:var(--mut);text-decoration:none;padding:3px 0}
.cp{margin-top:26px;color:var(--mut);font-size:13px}
/* compacto: 4 por fileira */
header{padding:12px 5vw}.logo{font-size:17px}.bag{padding:6px 14px;font-size:14px}
.hero{padding:4vh 5vw 0;gap:18px}
@media(min-width:800px){.hero{padding:5vh 5vw 0}}
.hero h1{font-size:clamp(28px,5.5vw,48px)}
.hbt{margin-top:18px}.btn{padding:10px 18px;font-size:14px}
#bn img{border-radius:14px;max-height:300px!important}
.sec{padding-top:4vh}.sh{margin-bottom:16px}.sh h2{font-size:clamp(20px,3vw,26px)}
.feat{grid-template-columns:repeat(4,1fr);gap:8px}
.feat.panel{padding:8px}
.item,.feat .item{padding:6px}
.item h3{font-size:11px;line-height:1.25;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
.item .pr{font-size:11px}.item .ds{display:none}
.acts{flex-direction:column;gap:5px}
.rd{padding:6px 2px;font-size:10px}.sq{width:100%;height:26px;font-size:15px}
.tag{font-size:9px;padding:2px 6px;left:4px;top:4px}
@media(min-width:800px){
.feat{gap:16px}.feat.panel{padding:16px}
.item,.feat .item{padding:12px}
.item h3{font-size:15px;margin-top:14px}.item .pr{font-size:15px}.item .ds{display:-webkit-box}
.acts{flex-direction:row;gap:8px}.rd{padding:11px;font-size:14px}.sq{width:44px;height:44px;font-size:20px}
.tag{font-size:12px;padding:3px 10px;left:10px;top:10px}}
.sq{display:flex;align-items:center;justify-content:center}.sq svg{width:15px;height:15px}
@media(min-width:800px){.sq svg{width:20px;height:20px}}
/* tema claro + seções */
.serif{font-family:var(--font-display);font-weight:var(--w-display);text-transform:var(--t-display);letter-spacing:0}
header{background:var(--head-bg)}.logo{color:var(--ink);font-size:26px;font-weight:700}
.item,.feat .item{background:var(--card);border:1px solid var(--line);border-radius:0;padding:8px}
.item .ph{background-color:var(--ph);border-radius:0}
.rd{background:var(--acc);border-radius:99px}.rd:hover:not(:disabled){background:var(--acc2)}
.sq{border-color:var(--acc);color:var(--acc)}.tag{background:var(--card);color:var(--ink)}
.btn{border-radius:0;border-color:var(--ink);color:var(--ink);letter-spacing:.04em;display:inline-block}
.bn{background:linear-gradient(135deg,var(--banner-from),var(--banner-to)) center/cover;min-height:min(50vw,400px);display:grid;place-items:center;text-align:center;color:var(--on-banner);position:relative}
.bn::before{content:'';position:absolute;inset:0;background:var(--overlay)}
.bi{position:relative;padding:8vh 6vw;max-width:720px}
.bn h2{font-size:clamp(32px,6vw,58px);line-height:1.05}.bn p{margin:12px auto 22px;max-width:46ch}
.bn .btn{color:var(--on-banner);border-color:var(--on-banner)}
.tx{text-align:center;padding:9vh 6vw 1vh;max-width:760px;margin:auto}
.tx h2{font-size:clamp(28px,5vw,44px)}.tx p{color:var(--cream);margin:12px 0 22px}
.ps{max-width:980px;margin:auto;padding:8vh 5vw 0}
.sh h2{font-size:clamp(26px,4vw,38px)}
.gr3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cw{position:relative}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car .item{flex:0 0 calc((100% - 24px)/3);scroll-snap-align:start}
.ar,.ar2{display:grid;place-items:center;position:absolute;top:12%;z-index:2;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;line-height:1;box-shadow:0 2px 12px rgba(0,0,0,.4);animation:nudge 1.8s ease-in-out 3}
.ar[data-d="-1"],.ar2[data-d="-1"]{left:4px}.ar[data-d="1"],.ar2[data-d="1"]{right:4px}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(var(--nx,4px))}}
.ar[data-d="-1"],.ar2[data-d="-1"]{--nx:-4px}
@media(min-width:800px){.ar{width:40px;height:40px;top:28%}.ar[data-d="-1"]{left:-18px}.ar[data-d="1"]{right:-18px}.gr3,.car{gap:20px}.car .item{flex-basis:calc((100% - 40px)/3)}}
.ph{cursor:pointer}
.zm{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.6);color:#fff;pointer-events:none;transition:transform .2s,background .2s;z-index:1}
.zm svg{width:17px;height:17px}.item:hover .zm{background:var(--acc);color:var(--on-acc);transform:scale(1.12)}
/* avaliações em carrossel: 1 central e metade de cada vizinha */
.avw{position:relative;max-width:980px;margin:auto}
.avw .avg{display:flex;grid-template-columns:none;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 0;--cw:50%;--g:10px;align-items:stretch}
.avw .avg::-webkit-scrollbar{display:none}
.avw .avg::before,.avw .avg::after{content:'';flex:0 0 calc((100% - var(--cw))/2 - var(--g))}
.avw .avc{padding:12px;font-size:13.5px;flex:0 0 var(--cw);scroll-snap-align:center;opacity:.5;transform:scale(.94);transition:opacity .35s,transform .35s;align-content:start}
.avw .avc.on{opacity:1;transform:none}
@media(min-width:800px){.avw .avg{--cw:50%;gap:16px;--g:16px}}
.avw .ar2{top:calc(50% - 18px)}
/* notificações (só no painel) */
#ntf{display:none;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;flex-direction:column;gap:8px;width:min(92vw,420px)}
body.adm #ntf{display:flex}
.toast{background:var(--card);color:var(--ink);border:1px solid var(--acc);border-radius:12px;padding:12px 14px;box-shadow:0 8px 28px rgba(0,0,0,.45);font-size:14px;line-height:1.35;cursor:pointer;animation:tin .25s ease-out}
.toast b{display:block;color:var(--acc);margin-bottom:2px}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.bdg{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--acc);color:var(--on-acc);font-size:11px;font-weight:700;line-height:18px}
.rk{display:grid;grid-template-columns:28px 44px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.rk img{width:44px;height:55px;object-fit:cover;border-radius:6px;background:var(--card)}
.rk .bar{height:6px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden}.rk .bar i{display:block;height:100%;background:var(--acc)}
.rk .n0{font-weight:700;color:var(--acc);text-align:center}
footer{max-width:none;margin:9vh 0 0;background:var(--foot-bg);border-top:1px solid var(--line)}
footer .fg a,footer .fg span,.cp{color:var(--foot-ink)}footer .fg b{color:var(--acc)}
select{width:100%;padding:11px 12px;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:0}
.row{flex-wrap:wrap}.row .n{flex:1;min-width:140px}
/* cabeçalho, busca, banner rotativo */
header{display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.hz{display:flex;align-items:center;gap:10px;min-width:0}.hl{justify-self:start}.hc{justify-self:center}.hr{justify-self:end}
.logo img{display:block;width:auto;max-width:48vw}
.logo[data-t=p]{font-size:18px}.logo[data-t=m]{font-size:24px}.logo[data-t=g]{font-size:32px}
.logo[data-t=p] img{height:24px}.logo[data-t=m] img{height:36px}.logo[data-t=g] img{height:52px}

.sl{position:absolute;inset:0;background:center/cover;opacity:0;transition:opacity 1s;z-index:0}.sl.on{opacity:1}
.bn::before{z-index:1}.bi{z-index:2}
.tabs{flex-wrap:wrap}
/* pop-up do produto */
.ph{cursor:zoom-in}
.md{position:fixed;inset:0;z-index:20;background:var(--scrim);display:grid;place-items:center;padding:16px}
.md[hidden]{display:none}

.mcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}

/* admin */
/* painel: organização profissional */
#admin .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:6;background:var(--bg);margin:10px 0 16px;padding:8px 0;border-bottom:1px solid var(--line)}
#admin .tabs::-webkit-scrollbar{display:none}#admin .tabs button{white-space:nowrap;flex:0 0 auto}
details.grp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card,12px);margin:0 0 10px;overflow:hidden}
details.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 16px}

@media(min-width:700px){.rl1 .item.rc1{grid-template-columns:38% 1fr}.rl1 .rc1 .pw{min-height:280px}.rl1 .rc1 .inf{padding:22px 26px;gap:10px}.rl1 .rc1 h3{font-size:24px}.rl1 .rc1 .ds{font-size:14px;-webkit-line-clamp:3}.rl1 .rc1 .pv{font-size:38px}.rl1 .rc1 .old{font-size:15px}.rl1 .rc1 .rd{width:auto;align-self:flex-start;padding:13px 30px;font-size:15px}}

/* ═══ RESPONSIVIDADE v2 ═══ */

body{min-height:100vh;min-height:100dvh}
input,textarea,select{font-size:16px}

.dr h2,.sc2 h1,.item h3{overflow-wrap:anywhere}

/* cabeçalho fixo; só as categorias descem junto */

}

/* cupons com estado visível */
.cps-t{max-width:980px;margin:16px auto 0;padding:0 16px;font:700 12px/1.3 var(--font-label);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.cps-t b{color:var(--acc)}
.cpc{cursor:pointer;min-width:0;transition:border-color .2s,background .2s,transform .12s;-webkit-tap-highlight-color:transparent}
.cpc:active{transform:scale(.98)}
.cpc .cpt{min-width:0}
.cpc .cpa{display:inline-flex;align-items:center;gap:5px;margin-left:4px;padding:3px 7px;border:1px solid var(--acc);border-radius:99px;color:var(--acc);font:700 9.5px/1.1 var(--font-label);white-space:nowrap}
.cpc .cpa em{font-style:normal}

.cpc.on .cpk::after{content:'';width:7px;height:4px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg) translate(1px,-1px)}
.cpc.used{opacity:.5}

@media(min-width:800px){.cps{flex-wrap:wrap;overflow:visible}}
#cpt{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(92vw,420px);background:var(--card);color:var(--ink);border:1px solid var(--acc);border-radius:99px;padding:10px 18px;font-size:14px;font-weight:600;text-align:center;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#cpt.on{opacity:1;transform:translate(-50%,0)}

/* frete por distância no carrinho */
#fr:empty{display:none!important}
.fq{display:grid;gap:8px;margin:2px 0 14px}

.fq-r:empty{display:none}
.fq-r.ok{color:var(--ok)}.fq-r.bad{color:#E88}

/* como chegar: mapa SVG */
.lj.loc{max-width:none;gap:14px}
.loc-t{display:grid;gap:6px;align-content:center}
.mapa{position:relative;display:block;width:100%;aspect-ratio:2/1;min-height:170px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-card);background:var(--ph);text-decoration:none;color:inherit}
.mapa-svg{display:block;width:100%;height:100%}
.m-land{fill:var(--ph)}.m-blk rect{fill:var(--card);stroke:var(--line);stroke-width:1}
.m-park{fill:var(--ok);opacity:.22}.m-water{fill:#4A90C2;opacity:.25}
.m-rd path{fill:none;stroke:var(--line);stroke-width:15;stroke-linecap:round}.m-rd .m-rd2{stroke-width:9}
.m-cl path{fill:none;stroke:var(--mut);stroke-width:1.4;stroke-dasharray:7 9;opacity:.4}
.m-pin path{fill:var(--acc);stroke:var(--bg);stroke-width:3}.m-pin circle{fill:var(--on-acc)}
.m-pin{transform-origin:327px 168px;animation:pinb 2.4s ease-in-out infinite}
.m-sh{fill:#000;opacity:.4}.m-ring{fill:none;stroke:var(--acc);stroke-width:2;transform-origin:327px 166px;animation:ringp 2.4s ease-out infinite}
@keyframes pinb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ringp{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}

.mapa:hover .mapa-b{background:var(--acc2)}
@media(min-width:800px){.lj.loc{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);align-items:center;gap:28px}.mapa{aspect-ratio:16/9}}
@media(prefers-reduced-motion:reduce){.m-pin,.m-ring{animation:none}}

/* grade e telas variadas */
@media(min-width:1100px){.gr3{grid-template-columns:repeat(4,1fr)}.car .item{flex-basis:calc((100% - 60px)/4)}}
@media(max-width:340px){.gr3{grid-template-columns:repeat(2,1fr)}.car .item{flex-basis:calc((100% - 12px)/2)}}
@media(max-height:520px) and (orientation:landscape){.ms{aspect-ratio:16/10}.mb{padding:12px}}
.xs-opts{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ln{flex-wrap:wrap}.ln .n{min-width:120px}
@media(max-width:380px){.dr{padding-left:16px;padding-right:16px}.xs-row{flex-wrap:wrap}.xs-row button{min-height:34px;flex:0 0 34px}}
@media(min-width:1600px){body{font-size:16px}}

/* ajustes finais de alinhamento (vêm por último para vencer as regras acima) */
@media(min-width:900px){
 .ps{max-width:none;width:min(1200px,calc(100% - 10vw));padding-left:0;padding-right:0}
 .cps-t,.cps{max-width:1200px;width:min(1200px,calc(100% - 10vw));padding-left:0;padding-right:0}
 .sc2{text-align:left;padding-left:150px;min-height:120px}
 .slg{left:28px;transform:none;top:-50px;width:112px;height:112px}
}
@media(max-width:899px){.cps-t{padding:0 16px}}

/* cadastro de endereço */
.adb{display:grid;gap:8px}
.ab-r{display:flex;gap:8px}.ab-r input{flex:1;min-width:0}
.ab-r button{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--acc);background:none;color:var(--acc);border-radius:var(--r-btn);font-weight:700;font-size:14px}
.ab-r button:disabled{opacity:.5}
.ab-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab-n{grid-template-columns:1fr auto;align-items:center}.ab-n .ck{white-space:nowrap;font-size:14px;color:var(--mut)}
.ab-cu{grid-template-columns:1fr 76px}.ab-cu #auf{text-transform:uppercase;text-align:center}
.adb input:disabled{opacity:.45}
#acepm{display:block;font-size:13px;color:var(--mut)}#acepm:empty{display:none}#acepm.ok{color:var(--ok)}#acepm.bad{color:#E88}
@media(max-width:360px){.ab-2:not(.ab-n):not(.ab-cu){grid-template-columns:1fr}}

#info[hidden]{display:none!important}
#entlb{margin-top:14px}
.fq-r a{color:inherit;text-decoration:underline;font-weight:700}
</style>
</head>

</div>

const card=p=>`<article class="item" data-pid="${p.id}"><div class="ph">${p.foto_url?`<img src="${esc(p.foto_url)}" alt="${esc(p.nome)}" width="480" height="600" loading="lazy" decoding="async">`:''}<span class="zm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M11 8.5v5M8.5 11h5"/></svg></span>${p.estoque<=0?'<span class="tag">Esgotado</span>':''}${eff(p)<p.preco?'<span class="sale">Promoção</span>':''}</div><h3>${esc(p.nome)}</h3><div class="pr">${px(p)}</div>${lowTxt(p)}${p.descricao?`<div class="ds">${esc(p.descricao)}</div>`:''}<div class="acts"><button class="rd" data-id="${p.id}" ${p.estoque<=0?'disabled':''}>${p.estoque<=0?'Indisponível':'Pedir agora'}</button><button class="sq" data-id="${p.id}" aria-label="Adicionar à sacola" ${p.estoque<=0?'disabled':''}>${CART}</button></div></article>`;
async function load(){
  const{data,error}=await sb.from('produtos').select('*').eq('ativo',true).order('criado_em',{ascending:false});

async function nom(p){const k='geo3:'+p;
  try{const c=JSON.parse(localStorage.getItem(k)||'null');if(Array.isArray(c))return c}catch(e){}
  await thr();

  const L=(Array.isArray(j)?j:[]).map(r=>({lat:+r.lat,lon:+r.lon,type:r.type,at:r.addresstype,a:r.address||{},bb:(r.boundingbox||[]).map(Number)}));
  if(L.length)try{localStorage.setItem(k,JSON.stringify(L))}catch(e){}return L}
const sameCity=(a,c)=>{const t=nz(c);if(!t)return true;return[a.city,a.town,a.village,a.municipality,a.city_district,a.county].filter(Boolean).map(nz).some(x=>x==t||x.includes(t)||t.includes(x))};
const okRes=(r,A)=>isLL(r)&&sameCity(r.a,A.cid)&&(!A.uf||!r.a['ISO3166-2-lvl4']||r.a['ISO3166-2-lvl4']=='BR-'+A.uf);
const isHouse=r=>r.type=='house'||r.at=='house'||!!(r.a&&r.a.house_number);
async function thr(){const w=_nomT+1100-Date.now();if(w>0)await new Promise(r=>setTimeout(r,w));_nomT=Date.now()}
const SUB=a=>[a.suburb,a.neighbourhood,a.quarter,a.city_district,a.borough].filter(Boolean).map(nz);
/* true = bairro confere, false = é outro bairro, null = o mapa não informa o bairro */
const bMatch=(a,bai)=>{const t=nz(bai);if(!t)return null;const L=SUB(a);if(!L.length)return null;return L.some(x=>x.includes(t)||t.includes(x))};
/* confere no mapa se uma coordenada realmente cai no bairro/rua informados (coordenada de CEP às vezes vem errada) */
async function revCheck(c,A){try{await thr();
  const j=await fj('https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=pt-BR&lat='+c.lat+'&lon='+c.lon),a=(j&&j.address)||{};
  if(!sameCity(a,A.cid))return false;const u=a['ISO3166-2-lvl4'];if(A.uf&&u&&u!='BR-'+A.uf)return false;
  const b=bMatch(a,A.bai);if(b!==null)return b;
  const ro=nz(a.road||''),rr=nz(A.rua);return!!(ro&&rr&&(rr.includes(ro)||ro.includes(rr)))}catch(e){return null}}
/* prioridade: casa exata (OSM) > coordenada do CEP confirmada no mapa > rua no bairro certo (OSM) > centro do bairro */
async function locateAddr(A){const C=[];
  if(A.rua&&A.cid){
    const pick=L=>{const f=L.filter(x=>okRes(x,A));return f.find(x=>bMatch(x.a,A.bai)===true)||f.find(x=>bMatch(x.a,A.bai)===null)||null};
    if(A.num&&!A.sn){try{const r=pick(await nom('street='+enc(A.num+' '+A.rua)+'&city='+enc(A.cid)));if(r)C.push({lat:r.lat,lon:r.lon,src:isHouse(r)?'casa':'rua',w:isHouse(r)?4:2})}catch(e){}}
    if(!C.some(c=>c.w==4)){try{const r=pick(await nom('street='+enc(A.rua)+'&city='+enc(A.cid)));if(r&&!C.some(c=>hav(c,r)<.05))C.push({lat:r.lat,lon:r.lon,src:'rua',w:2})}catch(e){}}}
  const h=C.find(c=>c.w==4);if(h)return h;
  if(isLL({lat:A.lat,lon:A.lon})){const c={lat:+A.lat,lon:+A.lon,src:'cep',w:3},v=await revCheck(c,A);if(v===true)return c;if(v===null&&!C.length)return c}
  if(C.length)return C[0];
  try{const L=await nom('q='+enc([A.bai,A.cid,A.uf].filter(Boolean).join(', '))),f=L.filter(x=>okRes(x,A)),r=f.find(x=>['suburb','neighbourhood','quarter','city_district','borough'].includes(x.at))||f[0];if(r)return{lat:r.lat,lon:r.lon,src:'bairro'}}catch(e){}
  return null}
function hav(a,b){const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function roadKm(a,b){const q=a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false';
  for(const h of['https://router.project-osrm.org/route/v1/driving/','https://routing.openstreetmap.de/routed-car/route/v1/driving/']){
    try{const j=await fj(h+q,8000);if(j&&j.routes&&j.routes[0])return j.routes[0].distance/1000}catch(e){}}
  return hav(a,b)*1.3}

async function locateStore(){const end=String((CAB.rod||{}).end||'').trim();if(!end)return null;
  const m=end.match(/(\d{5})-?(\d{3})/);let A={cid:'',uf:''};
  if(m){const d=m[1]+m[2],o=await cepLookup(d);if(o){const rest=end.replace(m[0],''),nm=rest.match(/,\s*(\d{1,6})\b/)||rest.match(/\b(\d{1,6})\s*(?:[-—,]|$)/);A={rua:o.rua,bai:o.bai,cid:o.cid,uf:o.uf,num:nm?nm[1]:'',lat:o.lat,lon:o.lon};const r=await locateAddr(A);if(r)return r}}

  const L=await nom('q='+enc(end)),nd=nz(end),r=L.find(x=>isLL(x)&&(()=>{const c=nz(x.a.city||x.a.town||x.a.village||x.a.municipality||'');return!!c&&nd.includes(c)})());if(r){const o={lat:r.lat,lon:r.lon,src:'texto'};try{localStorage.setItem(k,JSON.stringify(o))}catch(e){}return o}

async function fqCalc(src){const E=ENT(),S=(E.faixas||[]).filter(f=>f.km>0).sort((a,b)=>a.km-b.km);if(!S.length)return;

  try{
    const loja=await storeLoc();if(!loja){fqMsg('Não consegui localizar o endereço da loja. Avise o estabelecimento.','bad');return}
    let cli;
    {

      if(A.cep8.length!=8||!A.rua||!(A.num||A.sn)||!A.cid){fqMsg('Preencha CEP, rua, número e cidade para calcular.','bad');return}

      if(!cli){fqMsg('Não encontrei esse endereço no mapa. Confira rua, cidade e UF e toque em “Calcular frete”.','bad');return}}

    fqPaint();render();
  }catch(e){fqMsg('Falha ao calcular. Verifique a conexão e tente de novo.','bad')}

async function cepLookup(d){let o=null;
  try{const j=await fj('https://brasilapi.com.br/api/cep/v2/'+d,8000);
    if(j&&j.cep){o={rua:j.street||'',bai:j.neighborhood||'',cid:j.city||'',uf:j.state||''};const c=j.location&&j.location.coordinates;

    if(j&&!j.erro)o={rua:j.logradouro||(o&&o.rua)||'',bai:j.bairro||(o&&o.bai)||'',cid:j.localidade||'',uf:j.uf||'',lat:o&&o.lat,lon:o&&o.lon}}catch(e){}}
