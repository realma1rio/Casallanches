/* ══════════════════════════════════════════════════════════════
   TEMA — identidade visual do cliente. Para trocar de marca,
   altere SOMENTE este bloco (e as fontes no <head>).
   Nome da marca e logo padrão: veja CFG no início do <script>.
   ══════════════════════════════════════════════════════════════ */
:root{
 color-scheme:dark;
 /* fundos */
 --bg:#0F0A07;          /* fundo principal (marrom quase preto) */
 --card:#1A110C;        /* cartões, painéis, campos */
 --head-bg:rgba(15,10,7,.9); /* cabeçalho */
 --foot-bg:#0A0604;     /* rodapé */
 --ph:#120B07;          /* fundo atrás das fotos */
 --glow:radial-gradient(ellipse 85% 100% at 50% 0,rgba(255,106,0,.22),rgba(255,106,0,0) 70%); /* brilho no topo (use none p/ desligar) */
 /* textos */
 --ink:#FFF1E0;         /* texto principal (creme claro) */
 --mut:#BBA796;         /* texto secundário */
 --cream:#FFE3C2;       /* creme: textos de respiro */
 --foot-ink:#E8D3BB;    /* texto do rodapé */
 --on-banner:#FFFFFF;   /* texto sobre imagens de banner */
 /* destaque (dourado/bronze) */
 --acc:#FF7A1A;
 --acc2:#FF9A45;        /* hover */
 --on-acc:#1A0D05;      /* texto sobre botões dourados */
 /* linhas e camadas */
 --line:#3D2616;
 --scrim:rgba(5,3,2,.78);       /* fundo do pop-up */
 --overlay:rgba(8,5,3,.5);      /* véu sobre banners */
 --chip:rgba(13,9,7,.85);       /* botão fechar do pop-up */
 --banner-from:#2A0F05;         /* banner sem imagem */
 --banner-to:#B84A0B;
 --ok:#5DB487;                  /* pedido concluído */
 /* tipografia */
 --font-display:'Oswald','Arial Narrow',sans-serif;
 --font-body:'Inter',system-ui,sans-serif;
 --font-label:'Inter',system-ui,sans-serif; /* preços, etiquetas, rótulos */
 --w-display:600;
 --s-display:normal;    /* italic | normal */
 --t-display:uppercase;      /* none | uppercase */
 --t-label:uppercase;   /* none | uppercase */
 --ls-label:.08em;
 /* formas */
 --r-card:18px;         /* cartões e pop-up (0 = quadrado) */
 --r-btn:999px;         /* botões */
 --r-input:14px;        /* campos */
}
/* ═══════════════ FIM DO TEMA ═══════════════ */
/* ═══════════════ TEMA CLARO DA LOJA (botão de sol/lua no cabeçalho) ═══════════════ */
html[data-area="loja"][data-tema="light"]{
 color-scheme:light;
 --bg:#FBF6F0;--card:#FFFFFF;--head-bg:rgba(251,246,240,.92);--foot-bg:#F1E8DE;--ph:#F1E6DA;
 --glow:radial-gradient(ellipse 85% 100% at 50% 0,rgba(255,106,0,.12),rgba(255,106,0,0) 70%);
 --ink:#2A1810;--mut:#7A6656;--cream:#3A2416;--foot-ink:#5A4636;
 --acc:#D9500A;--acc2:#E8661F;--on-acc:#FFFFFF;
 --line:#E6D9CB;--scrim:rgba(40,25,15,.55);--chip:rgba(255,255,255,.92);--ok:#2E8B57;
}
html[data-area="loja"][data-tema="light"] .fc,html[data-area="loja"][data-tema="light"] .xs-cup .bad{color:#C62828}
html[data-area="loja"][data-tema="light"] .pop,html[data-area="loja"][data-tema="light"] #cbar,html[data-area="loja"][data-tema="light"] .toast{box-shadow:0 10px 30px rgba(60,35,15,.22)}
.thm{background:none;border:1px solid var(--line);color:var(--ink);border-radius:99px;width:40px;height:40px;display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px;padding:0}
.thm svg{width:19px;height:19px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font-body);padding-top:env(safe-area-inset-top,0)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.serif{font-family:'Bodoni Moda',Georgia,serif;font-weight:400}
header{display:flex;justify-content:space-between;align-items:center;padding:20px 5vw;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.logo{font-size:26px;letter-spacing:.04em}
.bag{background:none;border:1px solid var(--ink);border-radius:99px;padding:8px 18px;font-weight:500}
.hero{padding:9vh 5vw 6vh;max-width:1200px;margin:auto}
.hero h1{font-size:clamp(44px,9vw,116px);line-height:.98;letter-spacing:-.02em;max-width:11ch}
.hero p{margin-top:22px;color:var(--mut);max-width:34ch}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 14px;padding:0 5vw 10vh;max-width:1200px;margin:auto}
@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:44px 22px}}
.item .ph{aspect-ratio:4/5;background:var(--card) center/cover;position:relative;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s}
.item:hover .ph img{transform:scale(1.03)}
.item h3{font-size:14px;font-weight:500;margin-top:12px}
.item .pr{color:var(--mut);margin-bottom:10px}
.tag{position:absolute;left:10px;top:10px;background:var(--bg);padding:3px 10px;font-size:12px;border-radius:99px}
.old{color:var(--mut);text-decoration:line-through;font-weight:400;opacity:.75;margin-right:6px}
.promo{color:var(--acc)}
.sale{position:absolute;right:10px;top:10px;background:var(--acc);color:var(--on-acc);padding:3px 10px;font-size:11px;border-radius:99px;font-weight:700}
.add{width:100%;background:var(--ink);color:var(--bg);border:0;padding:11px;font-weight:500}
.add:disabled{background:var(--line);color:var(--mut);cursor:default}
.empty{grid-column:1/-1;color:var(--mut);padding:40px 0}
footer{padding:30px 5vw;border-top:1px solid var(--line);color:var(--mut);font-size:13px;display:flex;justify-content:space-between}
footer a{color:inherit}
.ov{position:fixed;inset:0;background:var(--scrim);display:none;z-index:10}
.ov.on{display:block}

#snav a.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
#pb{background:linear-gradient(100deg,var(--acc),var(--acc2),var(--acc));color:var(--on-acc);text-align:center;padding:10px 5vw;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}

#wfab{position:fixed;right:16px;bottom:16px;z-index:40;width:54px;height:54px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}

.lw{font-size:11.5px;font-weight:700;color:var(--acc);text-align:center}
.lj{display:grid;gap:8px;max-width:520px}.lj p{margin:0}

.xs-opt input{width:auto;accent-color:var(--acc)}.xs-opt.on{border-color:var(--acc);background:rgba(255,122,26,.1)}
.xs-cup{margin:8px 0 2px}.xs-row{display:flex;gap:8px}.xs-row input{flex:1;min-width:0;text-transform:uppercase}.xs-row input::placeholder{text-transform:none}

.xs-cup small{display:block;margin-top:6px;color:var(--mut)}.xs-cup small:empty{display:none}.xs-cup .ok{color:var(--ok)}.xs-cup .bad{color:#E88}
.dsc .dl{display:flex;justify-content:space-between;color:var(--acc);padding:4px 0}

.bag .ci{width:24px;height:24px}
.bag .cnt{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--acc);color:var(--on-acc);font-size:12px;font-weight:700;line-height:20px;text-align:center}

 header{padding-top:16px;padding-bottom:16px}
 .srch{height:48px;padding:0 22px}
 .srch[data-t=p]{--sw:240px}.srch[data-t=m]{--sw:360px}.srch[data-t=g]{--sw:480px}
 .hc .srch[data-t=p]{--sw:340px}.hc .srch[data-t=m]{--sw:520px}.hc .srch[data-t=g]{--sw:680px}
}

/* responsividade geral */
img,svg,video{max-width:100%}

.dr{width:min(440px,100vw)}
.mb{max-height:92dvh}

header:has(.srch) .hz{flex:none;gap:20px}

header .hz .srch{flex:1 1 0;width:auto;max-width:none;min-width:0}
header:has(.srch) .logo{flex:none}
.igi{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border:1px solid var(--acc);border-radius:50%;color:var(--acc)}.form input:not([type=checkbox]):not([type=file]),.form select,.form textarea{font-size:18px;padding:14px}.form .lb{font-size:16px;font-weight:600}
.cal{max-width:340px;margin:10px 0}.cg,.cw7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw7{text-align:center}.cg button{position:relative;padding:9px 0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px}.cg .on{border-color:var(--acc);background:rgba(255,122,26,.15)}.cg b{position:absolute;top:-6px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}.ow{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:start}.oc{display:grid;gap:6px;position:sticky;top:8px}.oc button{display:flex;justify-content:space-between;align-items:center;padding:11px 10px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:8px}.oc .on{border-color:var(--acc);color:var(--ink)}.oc i{font-style:normal;color:var(--acc);font-weight:700}
.ii{display:inline-grid;place-items:center;width:20px;height:20px;border:1px solid var(--acc);border-radius:50%;color:var(--acc);font-size:12px;font-style:normal;margin-left:8px;cursor:pointer;flex:none}.pop{position:fixed;left:5vw;right:5vw;bottom:16px;max-width:460px;margin:auto;background:var(--card);color:var(--ink);border:1px solid var(--acc);border-radius:12px;padding:14px 16px;z-index:99;font-size:15px;line-height:1.5;box-shadow:0 10px 30px #000a}.kpg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kp,.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.kp small{display:block;color:var(--mut)}.kp b{font-size:22px}.cd{margin:12px 0}.cd h3{margin:0 0 10px;font-size:16px}.bc{display:flex;align-items:stretch;gap:4px;height:150px}.bi{flex:1;display:flex;flex-direction:column;align-items:center;min-width:0}.bw{flex:1;width:100%;display:flex;align-items:flex-end}.bw span{width:100%;background:linear-gradient(var(--acc),rgba(255,122,26,.25));border-radius:6px 6px 0 0}.bi em{font-style:normal;font-size:10px;color:var(--mut)}.bi small{font-size:10px;color:var(--mut);height:12px}.hb{margin:10px 0}.hb i{display:block;height:8px;border-radius:4px;background:var(--acc);margin-top:4px}

/* ═══════════════════════════════════════════════════════════════
   PAINEL — visual claro (cabeçalho escuro, cartões brancos, botões
   em pílula, menu lateral). Só vale dentro do #admin (body.adm);
   a loja do cliente não muda.
   ═══════════════════════════════════════════════════════════════ */
body.adm{
 color-scheme:light;
 --bg:#FAF7F2;--card:#FFFFFF;--ink:#1F1611;--mut:#7A6D62;--line:#E6DED3;
 --acc:#E0520F;--acc2:#F06A28;--on-acc:#FFFFFF;--ok:#1E9E55;
 --font-display:'Figtree',system-ui,sans-serif;--font-body:'Figtree',system-ui,sans-serif;--font-label:'Figtree',system-ui,sans-serif;
 --t-display:none;--t-label:none;--s-display:normal;--ls-label:0;
 --r-card:22px;--r-btn:999px;--r-input:999px;
 --dk:#1F1611;--soft:#F1E9E0;--field:#FAF6F1;
 --shadow:0 1px 2px rgba(60,35,15,.05),0 6px 20px rgba(60,35,15,.07);
 font-family:var(--font-body)
}
body.adm.dopen{overflow:hidden}
#admin{max-width:none;margin:0;padding:0 0 110px}
body.adm .serif{font-family:var(--font-body);font-weight:800;text-transform:none;letter-spacing:0}
.apage{max-width:900px;margin:auto;padding:16px 15px}
.apage>h1{font-size:28px;margin-bottom:14px}
/* cabeçalho */
.ahd{position:sticky;top:0;z-index:20;background:var(--dk);color:#FFF1E6;display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid rgba(255,255,255,.08)}
.alogo{width:40px;height:40px;border-radius:13px;background:var(--acc);color:#fff;display:grid;place-items:center;flex:none}
.alogo svg{width:22px;height:22px}
.ahd .t{flex:1;min-width:0}
#admin .ahd h1{font-size:18px;font-weight:800;line-height:1.2;margin:0;color:#fff}
.ahd small{display:block;color:#C9B8A8;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;background:none;border:0;color:#fff;padding:6px;display:grid}
.bell svg{width:25px;height:25px}
.bell i{position:absolute;top:-2px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:99px;background:var(--acc);color:#fff;font:700 11px/19px var(--font-body);font-style:normal;text-align:center}
/* menu lateral */
.afab{position:fixed;left:15px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:48px;height:48px;border-radius:50%;background:var(--dk);color:#fff;border:0;display:grid;place-items:center;z-index:30;box-shadow:0 8px 20px rgba(31,22,17,.35)}
.afab svg{width:22px;height:22px}
.aov{position:fixed;inset:0;background:rgba(20,12,6,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.adr{position:fixed;left:0;top:0;bottom:0;width:min(300px,80vw);background:var(--dk);color:#F3E6D8;z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0);transform:translateX(-100%);visibility:hidden;transition:transform .28s,visibility 0s .28s}
body.dopen .aov{opacity:1;pointer-events:auto}
body.dopen .adr{transform:none;visibility:visible;transition-delay:0s}
.adr .top{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid rgba(255,255,255,.1)}
.adr .top .t{flex:1;min-width:0}.adr .top b{display:block;font-size:17px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.adr .top small{color:#C9B8A8;font-size:13px}
.adr .top button{background:none;border:0;color:#fff;padding:6px;display:grid}
.adr nav{display:grid;gap:4px;padding:12px 10px;align-content:start;overflow:auto;flex:1}
.adr nav button,.adr .ft button,.adr .ft a{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-radius:999px;color:#F3E6D8;padding:12px 16px;font-size:16px;font-weight:500;text-decoration:none}
.adr nav button.on{background:var(--acc);color:#fff}
.adr svg{width:22px;height:22px;flex:none}
.adr .bdg{margin:0 0 0 auto}.adr .on .bdg{background:#fff;color:var(--acc)}
.adr .ft{display:grid;gap:2px;padding:10px;border-top:1px solid rgba(255,255,255,.1);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
/* títulos de página */
.phd h2{font-size:24px;font-weight:800;line-height:1.15}
.phd p{color:var(--mut);font-size:14px;margin:3px 0 14px}
/* cartões */
body.adm .form,body.adm .cd,body.adm .kp,body.adm .ord,body.adm details.grp,body.adm .row{background:#fff;border:0;border-radius:var(--r-card);box-shadow:var(--shadow)}
body.adm .form{padding:20px;gap:12px}
body.adm .form.gp{background:none;box-shadow:none;padding:0}
body.adm .row{padding:12px 14px;margin:0 0 12px}
body.adm .row img{border-radius:14px}
body.adm details.grp>summary{padding:16px 18px}
body.adm details.grp>summary .gt b{font-size:16px;font-weight:800}
body.adm .kp,body.adm .cd{padding:16px}
/* campos e botões */
body.adm input:not([type=checkbox]):not([type=radio]):not([type=file]),body.adm select,body.adm textarea{background:var(--field);border:1px solid var(--line);border-radius:999px;padding:11px 18px;font-size:15px}
body.adm textarea{border-radius:20px!important}
body.adm input[type=checkbox],body.adm input[type=radio]{accent-color:var(--acc)}
body.adm .lb{color:var(--ink);font-size:15px;font-weight:500;margin-top:6px}
body.adm .wa{border-radius:999px;padding:12px 22px;font-weight:700;font-size:16px;box-shadow:0 6px 16px rgba(224,82,15,.25)}
body.adm .wa.nw{display:inline-flex;align-items:center;gap:8px;width:auto;margin:0 0 14px}
body.adm .wa svg{width:20px;height:20px}
body.adm .sm{border:0;background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:600;color:var(--ink)}
body.adm .toast{box-shadow:0 8px 28px rgba(60,35,15,.25)}
/* pausar pedidos: aviso no WhatsApp */
body.adm .pzm{position:fixed;inset:0;z-index:9999;background:rgba(20,12,6,.55);display:grid;place-items:center;padding:20px}
body.adm .pzb{background:#fff;color:var(--ink);border-radius:24px;padding:24px 22px 18px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:12px}
body.adm .pzb h3{margin:0;font-size:22px;font-weight:800}
body.adm .pzb p{margin:0;color:var(--mut);line-height:1.45}
body.adm .pzi{width:46px;height:46px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center}
body.adm .pzi svg{width:24px;height:24px}
body.adm .pzb textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:16px;resize:vertical;background:var(--bg)}
body.adm .pzs{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#fff;border-radius:999px;padding:14px 18px;font-weight:700;text-decoration:none}
body.adm .pzs svg{width:20px;height:20px}
body.adm .pzn{background:none;border:0;color:var(--mut);font:inherit;font-weight:600;padding:10px}

body.adm .icat{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);line-height:1.2;margin-bottom:1px}

/* painel: linha, colunas, ticket */
body.adm .kp3{gap:8px}body.adm .kp3 .kp{padding:12px 6px;text-align:center;min-width:0}body.adm .kp3 .kp small{font-size:clamp(10px,2.9vw,13px);line-height:1.2}body.adm .kp3 .kp b{display:block;margin-top:4px;font-size:clamp(14px,4.6vw,24px);white-space:nowrap}
body.adm .hbr{display:flex;justify-content:space-between;align-items:baseline;gap:8px}body.adm .hbr em{font-style:normal;font-weight:700;color:var(--acc);white-space:nowrap}
body.adm .cxpg{margin:10px 0}body.adm .cxpg>small{display:block;margin-bottom:6px;font-weight:700}
body.adm .kpg .tkc{grid-column:1/-1;justify-self:center;width:62%;min-width:180px;text-align:center}
body.adm .lc{width:100%;height:auto;display:block;margin-top:6px}
body.adm .bw span.hi{background:var(--acc)}

/* produtos: categorias (seções), disponível, excluir */
body.adm .catc h3{margin:0 0 4px;font-size:20px;font-weight:800}
body.adm .chs{display:block;color:var(--mut);margin-bottom:12px}
body.adm .chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
body.adm .chip{display:inline-flex;align-items:center;background:var(--soft);color:var(--ink);border-radius:999px;font-size:15px;overflow:hidden}
body.adm .chip button{background:none;border:0;color:inherit;font:inherit;padding:10px 16px}
body.adm .chip:has(.cx) button:first-child{padding-right:6px}
body.adm .chip button.cx{padding:10px 14px 10px 4px;color:var(--mut);display:grid}

@media(min-width:700px){.rl1 .item.rc1{grid-template-columns:38% 1fr}.rl1 .rc1 .pw{min-height:280px}.rl1 .rc1 .inf{padding:22px 26px;gap:10px}.rl1 .rc1 h3{font-size:24px}.rl1 .rc1 .ds{font-size:14px;-webkit-line-clamp:3}.rl1 .rc1 .pv{font-size:38px}.rl1 .rc1 .old{font-size:15px}.rl1 .rc1 .rd{width:auto;align-self:flex-start;padding:13px 30px;font-size:15px}}

/* ═══ RESPONSIVIDADE v2 ═══ */

}

/* cupons com estado visível */
.cps-t{max-width:980px;margin:16px auto 0;padding:0 16px;font:700 12px/1.3 var(--font-label);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}

.cpc{cursor:pointer;min-width:0;transition:border-color .2s,background .2s,transform .12s;-webkit-tap-highlight-color:transparent}
.cpc:active{transform:scale(.98)}
.cpc .cpt{min-width:0}
.cpc .cpa{display:inline-flex;align-items:center;gap:5px;margin-left:4px;padding:3px 7px;border:1px solid var(--acc);border-radius:99px;color:var(--acc);font:700 9.5px/1.1 var(--font-label);white-space:nowrap}
.cpc .cpa em{font-style:normal}

.cpc.on .cpk::after{content:'';width:7px;height:4px;border-left:2px solid var(--acc);border-bottom:2px solid var(--acc);transform:rotate(-45deg) translate(1px,-1px)}

#cpt{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);max-width:min(92vw,420px);background:var(--card);color:var(--ink);border:1px solid var(--acc);border-radius:99px;padding:10px 18px;font-size:14px;font-weight:600;text-align:center;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 28px rgba(0,0,0,.45)}
#cpt.on{opacity:1;transform:translate(-50%,0)}

/* frete por distância no carrinho */
#fr:empty{display:none!important}

/* como chegar: mapa SVG */
.lj.loc{max-width:none;gap:14px}
.loc-t{display:grid;gap:6px;align-content:center}
.mapa{position:relative;display:block;width:100%;aspect-ratio:2/1;min-height:170px;overflow:hidden;border:1px solid var(--line);border-radius:var(--r-card);background:var(--ph);text-decoration:none;color:inherit}
.mapa-svg{display:block;width:100%;height:100%}
.m-land{fill:var(--ph)}.m-blk rect{fill:var(--card);stroke:var(--line);stroke-width:1}
.m-park{fill:var(--ok);opacity:.22}.m-water{fill:#4A90C2;opacity:.25}
.m-rd path{fill:none;stroke:var(--line);stroke-width:15;stroke-linecap:round}.m-rd .m-rd2{stroke-width:9}
.m-cl path{fill:none;stroke:var(--mut);stroke-width:1.4;stroke-dasharray:7 9;opacity:.4}
.m-pin path{fill:var(--acc);stroke:var(--bg);stroke-width:3}.m-pin circle{fill:var(--on-acc)}
.m-pin{transform-origin:327px 168px;animation:pinb 2.4s ease-in-out infinite}
.m-sh{fill:#000;opacity:.4}.m-ring{fill:none;stroke:var(--acc);stroke-width:2;transform-origin:327px 166px;animation:ringp 2.4s ease-out infinite}
@keyframes pinb{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes ringp{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.mapa-b{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:99px;background:var(--acc);color:var(--on-acc);font:700 14px/1 var(--font-body);box-shadow:0 6px 18px rgba(0,0,0,.45)}

/* ═══════════════ PEDIDO NO BALCÃO, PAGAMENTOS E STATUS ═══════════════ */
.st.preparo.bal{background:#7A5AF8}
.pgg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}

.pgi{background:var(--soft);border-radius:16px;padding:10px;display:grid;gap:2px;min-width:0}
.pgi small{color:var(--mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.pgi b{font-size:13.5px;white-space:nowrap}.pgi span{font-size:14px;color:var(--acc);font-weight:700;overflow-wrap:anywhere}
.pgo{display:block;color:var(--mut);margin-top:8px;font-size:12.5px}
.pgh{display:block;color:var(--mut);margin:0 0 8px}
.nb-f{display:grid;gap:8px}
.nb-f input:not([type=radio]),.nb-f textarea{width:100%;box-sizing:border-box}
body.adm .osh .nb-f textarea{border-radius:18px}
.nb-seg,.nb-p{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nb-opt{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:2px solid var(--line);border-radius:999px;font-weight:700;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.nb-opt input{position:absolute;opacity:0;pointer-events:none}
.nb-opt.on{border-color:var(--acc);background:rgba(255,122,26,.12);color:var(--acc)}
.nb-opt svg{width:18px;height:18px;flex:none}
.nb-l{display:grid;gap:6px;max-height:34vh;overflow:auto;padding-right:2px}
.nb-r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:16px}
.nb-r.nb-x{opacity:.45}
.nb-r .n{min-width:0;display:grid;overflow-wrap:anywhere}.nb-r .n small{color:var(--mut)}
.nb-s{display:flex;align-items:center;gap:8px;flex:none}
.nb-s button{width:34px;height:34px;border-radius:50%;border:1px solid var(--acc);background:none;color:var(--acc);font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center;padding:0}
.nb-s button:disabled{opacity:.35}
.nb-s b{min-width:20px;text-align:center}
.nb-ad{border:1px solid var(--line);border-radius:16px}
.nb-ad>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.nb-ad>summary::-webkit-details-marker{display:none}
.nb-ad>summary::after{content:'▾';transition:transform .2s}
.nb-ad[open]>summary::after{transform:rotate(180deg)}
.nb-ad .nb-l{padding:0 8px 8px;max-height:30vh}
.nb-ad h4{margin:6px 6px 0;font-size:13px;color:var(--mut);font-weight:600}
.osh .nb-go{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:14px;font-size:16px;font-weight:700;border:0;background:#1E9E55;color:#fff;width:100%}
.osh .nb-go svg{width:20px;height:20px;flex:none}
.osh .nb-go:disabled{opacity:.5}

const fixP=d=>(d||[]).map(p=>p.foto_url||!FOTOS.prod[p.nome]?p:{...p,foto_url:FOTOS.prod[p.nome],fotos:[FOTOS.prod[p.nome]]});
const LCg=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},LCs=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function perf(){try{[...document.querySelectorAll('#secs .item img')].slice(0,2).forEach(i=>{i.loading='eager';i.fetchPriority='high'})}catch(e){}}
function hydrate(){const p=LCg('c_p'),c=LCg('c_c');if(!p&&!c)return;window._hyd=1;
 if(c){if(c.nome)CFG.nome=c.nome;if(c.whatsapp)CFG.whatsapp=c.whatsapp;if(c.cab)CAB={...CAB,...c.cab,rod:{...CAB.rod,...(c.cab.rod||{})}};if(Array.isArray(c.secoes)&&c.secoes.length)SEC=c.secoes;window._csig=JSON.stringify(c)}
 if(p){prods=fixP(p);window._psig=JSON.stringify(p)}
 try{renderHead();renderFoot();renderPromo();entRule();renderSecs();render();perf();seoQ()}catch(e){}}
async function load(){
  const{data,error}=await sb.from('produtos').select('*').eq('ativo',true).order('criado_em',{ascending:false});
  if(error&&window._hyd)return;
  const sig=error?'':JSON.stringify(data);if(!error&&data)LCs('c_p',data);
  if(window._hyd&&sig&&sig===window._psig)return;window._psig=sig;
  prods=fixP(data);window._err=error;renderSecs();render();perf();seoQ();
}
